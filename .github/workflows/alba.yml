name: ALBA - acciones intradia (paper)

# Corre solo en la nube de GitHub, con la compu apagada. Dinero ficticio (Alpaca Paper).
# GitHub NO cumple los crons al minuto (el bot Turtle, programado cada 15 min, corre ~4 veces por dia). Por eso ALBA
# no depende de un cron frecuente: cada corrida es una SESION LARGA que revisa el mercado cada minuto hasta el cierre.
# Disparos (UTC) de lunes a viernes: 13:05 / 13:35 / 14:05 inician la sesion (la apertura NYSE es 13:30 o 14:30 UTC segun
# horario de verano); 18:30 y 19:05 son el relevo, porque una corrida dura como maximo 340 min (limite de GitHub: 360).
# Si una sesion esta en curso, el disparo siguiente queda en espera (concurrency) y arranca cuando ella termina.
on:
  schedule:
    - cron: "5 13 * * 1-5"
    - cron: "35 13 * * 1-5"
    - cron: "5 14 * * 1-5"
    - cron: "30 18 * * 1-5"
    - cron: "5 19 * * 1-5"
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Solo probar conexiones (Yahoo, Nasdaq Trader, Alpaca) y avisar el resultado"
        type: boolean
        default: false
      un_ciclo:
        description: "Correr UN solo ciclo y terminar (en vez de la sesion larga)"
        type: boolean
        default: false

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.diagnostico) && 'alba-diagnostico' || 'alba' }}
  cancel-in-progress: false   # nunca cortar un ciclo a mitad de una orden

permissions:
  contents: write   # guardar el estado en la rama alba-estado
  issues: write     # avisos de cada operacion

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout (codigo)
        uses: actions/checkout@v4

      - name: Verificar que las claves estan cargadas
        id: claves
        env:
          K: ${{ secrets.ALBA_ALPACA_KEY }}
          S: ${{ secrets.ALBA_ALPACA_SECRET }}
        run: |
          if [ -n "$K" ] && [ -n "$S" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Faltan los secrets ALBA_ALPACA_KEY / ALBA_ALPACA_SECRET: no se hace nada (ver proyectos/alba/README.md)."
          fi

      - name: Setup Python
        if: steps.claves.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar la rama de estado (alba-estado)
        if: steps.claves.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin alba-estado >/dev/null 2>&1; then
            git fetch origin alba-estado
            git worktree add --detach estado origin/alba-estado
          else
            git worktree add --detach estado HEAD
            git -C estado checkout -q --orphan alba-estado
            git -C estado rm -rq --cached . || true
            find estado -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: Tests offline (si fallan no se opera)
        if: steps.claves.outputs.ok == 'true'
        run: python -m unittest discover -s alba/tests

      - name: Correr un ciclo de ALBA
        if: steps.claves.outputs.ok == 'true'
        env:
          ALBA_ALPACA_KEY: ${{ secrets.ALBA_ALPACA_KEY }}
          ALBA_ALPACA_SECRET: ${{ secrets.ALBA_ALPACA_SECRET }}
          ALBA_TELEGRAM_TOKEN: ${{ secrets.ALBA_TELEGRAM_TOKEN }}
          ALBA_TELEGRAM_CHAT: ${{ secrets.ALBA_TELEGRAM_CHAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ inputs.diagnostico }}" = "true" ]; then
            python alba/orquestador.py --estado estado --diagnostico
          elif [ "${{ inputs.un_ciclo }}" = "true" ]; then
            python alba/orquestador.py --estado estado
          else
            python alba/orquestador.py --estado estado --sesion
          fi

      - name: Guardar el estado
        if: always() && steps.claves.outputs.ok == 'true'
        run: |
          cd estado
          git add -A
          git diff --cached --quiet || git commit -q -m "alba: estado $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git rev-parse -q --verify HEAD >/dev/null || { echo "nada que guardar todavia"; exit 0; }
          for i in 1 2 3; do
            git push origin HEAD:alba-estado && break
            git fetch origin alba-estado && git rebase origin/alba-estado
          done
